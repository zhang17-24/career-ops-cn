# 中国校招企业官网配置
# 数据源：job-apply/references/companies.md（223 家、16 类）
# 运行 npm run import:job-sites 可从更新后的 Markdown 重新生成。
title_filter:
  positive:
    - 产品经理
    - 软件工程师
    - 前端
    - 后端
    - 算法
    - 数据
    - 人工智能
    - 大模型
  negative: []
location_filter:
  allow:
    - 中国
    - 北京
    - 上海
    - 深圳
    - 广州
    - 杭州
    - 成都
    - 南京
    - 武汉
    - 西安
    - 苏州
    - 远程
  block_hard:
    - 美国
    - 英国
    - 新加坡
    - 印度
    - United States
    - United Kingdom
    - Singapore
    - India
max_posting_age_days: 30
tracked_companies:
